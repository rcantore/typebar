[workspace]
members = ["cargo:crates/typebar-tui"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# GitHub retiro la imagen `macos-14`, que es la que dist 0.32.0 pide por
# defecto para aarch64-apple-darwin: el job moria en 1 segundo sin correr un
# solo step ("The configuration 'macos-14-arm64-us-default' is not supported")
# y se llevaba puestos `host` y `announce`, asi que el tag no generaba release.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-latest"
